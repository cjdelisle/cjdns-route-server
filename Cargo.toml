[workspace]
resolver = "2"
members = [
    "cjdns-crypto",
    "cjdns-core",
    "cjdns-keys",
    "cjdns-bencode",
    "cjdns-bytes",
    "cjdns-ann",
    "cjdns-hdr",
    "cjdns-ctrl",
    "cjdns-admin",
    "cjdns-sniff",
    "cjdns-snode",
    "netchecksum",
    "cjdns-nameserver",
    "cjdns",
    "cjdns-ptest",
    "cjdns-snode-wire",
    "cjdns-util",
    "cjdns-util-http",
    "cjdns-eth-rpc",
    "cjdns-pns",
    "cjdns-pkt-abi",
]

[workspace.dependencies]
eyre = "0.6.12"
dirs = "5"
hex = "0.4"
rand = "0.7"
regex = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sodiumoxide = { git = "https://github.com/cjdelisle/sodiumoxide", rev = "2c1406ce59c3ebe702cb72b37c67d897e4e2ac34", version = "0.2", default-features = false, features = ["std"] }
libsodium-sys = { git = "https://github.com/cjdelisle/sodiumoxide", rev = "2c1406ce59c3ebe702cb72b37c67d897e4e2ac34", version = "0.2" }
ed25519 = "1.5.3" # Sodium includes this as "1" but we depend on things which are not available in older versions.
thiserror = "1.0"
tokio = { version = "^1", features = ["full"] }
warp = "0.3"
tokio-tungstenite = "0.21"
clap = { version = "4", features = [ "derive" ] }
env_logger = "0.11"
futures = "0.3"
http = "1"
lazy_static = "1.4"
log = "0.4"
parking_lot = "0.12"
rmpv = "0.4" # msgpack encoding
chrono = "0.4"
num_enum = "0.7"
data-encoding = "2.3"
strum = { version = "0.26", features = ["derive"] }
byteorder = "1.5"
base64 = "0.21"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json"]  }
hickory-server = "0.24.1"
hickory-client = "0.24.1"
async-trait = "0.1.83"
alloy = { git = "https://github.com/alloy-rs/alloy", version = "0.6.4", rev = "v0.6.4", features = ["full","signer-mnemonic"] }
alloy-sol-types = "0.8.0"
futures-util = "0.3"
itertools = "0.13.0"

cjdns-admin = { path = "cjdns-admin" }
cjdns-ann = { path = "cjdns-ann" }
cjdns-bencode = { path = "cjdns-bencode" }
cjdns-bytes = { path = "cjdns-bytes" }
cjdns-core = { path = "cjdns-core" }
cjdns-crypto = { path = "cjdns-crypto" }
cjdns-ctrl = { path = "cjdns-ctrl" }
cjdns-hdr = { path = "cjdns-hdr" }
cjdns-keys = { path = "cjdns-keys" }
cjdns-sniff = { path = "cjdns-sniff" }
netchecksum = { path = "netchecksum" }
cjdns-snode-wire = { path = "cjdns-snode-wire" }
cjdns-util = { path = "cjdns-util" }
cjdns-util-http = { path = "cjdns-util-http" }
cjdns-eth-rpc = { path = "cjdns-eth-rpc" }
cjdns-pns = { path = "cjdns-pns" }
cjdns-pkt-abi = { path = "cjdns-pkt-abi" }
